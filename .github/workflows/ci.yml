name: CI

# Pull requests are gated on build and test only. Packaging an MSI on every PR push costs a
# couple of minutes and produces an artefact nobody installs, so it is deliberately not done
# here — main is protected, so nothing reaches main without this workflow passing anyway.
#
# The push run on main is the one that packages and publishes: it builds the MSI from the
# merged state and cuts a release for it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Warnings are errors repo-wide, and BannedApiAnalyzers fails the build on any use of
      # System.Net, Dns, WebClient or EventSource. The offline guarantee (PRD FR-8.1, FR-8.3)
      # is enforced by this step rather than by a reviewer remembering to look for it.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      # Every unit test passed while 1.0.1 shipped an application that could not open a window.
      # Nothing under tests/ can catch that: the failure was a XAML resource missing from the
      # packaged output, so it only exists once the app is published and started from somewhere
      # other than its own source folder. This step is the only thing in CI that exercises
      # "does it actually start", and its absence is why the defect reached an operator.
      - name: Smoke test that the published application starts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet publish src/ContactQR.App -c Release -r win-x64 --self-contained false -p:DebugType=none -o artifacts/smoke

          $logs = Join-Path $env:APPDATA 'ContactQR\logs'
          Remove-Item (Join-Path $logs '*.log') -Force -ErrorAction SilentlyContinue

          # Started from a directory that is not the publish folder, because resource resolution
          # that silently depends on the working directory is the exact defect this guards.
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\smoke\ContactQR.App.exe'
          Push-Location $env:TEMP
          $app = Start-Process -FilePath $exe -PassThru
          Pop-Location

          Start-Sleep -Seconds 20

          $exitedEarly = $app.HasExited
          if (-not $exitedEarly) { Stop-Process -Id $app.Id -Force }

          $log = Get-ChildItem (Join-Path $logs '*.log') -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime |
            Select-Object -Last 1

          if (-not $log) {
            throw "The application wrote no diagnostic log, so it never reached startup."
          }

          # Copied into the workspace before any failure below, so the log survives as an
          # artefact on exactly the runs where it is worth reading.
          New-Item -ItemType Directory -Force -Path artifacts/startup-log | Out-Null
          Copy-Item $log.FullName artifacts/startup-log/

          Write-Host "--- diagnostic log ---"
          Get-Content $log.FullName | Write-Host
          Write-Host "--- end of log ---"

          if ($exitedEarly) {
            throw "The application exited during startup with code $($app.ExitCode)."
          }

          if (Select-String -Path $log.FullName -Pattern 'ERROR' -SimpleMatch -Quiet) {
            throw "The application logged an error during startup."
          }

          Write-Host "Started, held its window for 20 seconds, and logged no errors."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-log
          path: artifacts/startup-log
          retention-days: 14
          if-no-files-found: warn

  release:
    name: release
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Directory.Build.props is the single source of truth for the version, so the release tag
      # cannot drift from what the MSI reports in Programs and Features.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "No <Version> found in Directory.Build.props" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      # A merge that does not bump the version is normal — most are. Publishing over an existing
      # release would replace an artefact someone may already have downloaded, so an existing
      # tag means skip, not fail.
      #
      # `gh release view` exits 1 when the release does not exist, and a pwsh step ends with an
      # implicit `exit $LASTEXITCODE`. Left alone that fails the step on exactly the path that
      # should proceed, so the code is captured and then cleared deliberately.
      - name: Check whether this version is already released
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag 1>$null 2>$null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists. Skipping — bump <Version> to cut a new one."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "No release for $tag yet. Building and publishing one."
          }

          exit 0

      # The installer harvests whatever is in artifacts/publish, so the publish must precede the
      # WiX build. DebugType=none keeps symbol files out of the shipped payload.
      - name: Publish application
        if: steps.existing.outputs.exists == 'false'
        run: >
          dotnet publish src/ContactQR.App
          -c Release -r win-x64 --self-contained false
          -p:DebugType=none
          -o artifacts/publish

      - name: Build MSI
        if: steps.existing.outputs.exists == 'false'
        run: dotnet build installer/ContactQR.Installer.wixproj -c Release

      - name: Upload MSI artefact
        if: steps.existing.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ContactQR-msi
          path: installer/bin/Release/ContactQR.msi
          retention-days: 90
          if-no-files-found: error

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"

          # A literal here-string, so the backticks that make markdown inline code are not read
          # as PowerShell escape characters. The one value that must interpolate is appended
          # afterwards rather than making the whole block interpolating.
          $notes = @'
          Offline vCard QR code generator for printed business cards.

          **Download** the `ContactQR.msi` below. It installs, upgrades an existing copy in
          place, and uninstalls from Programs and Features.

          Your client library lives at `%APPDATA%\ContactQR\library.db` and is **not** removed
          when you uninstall — those are your own client records.

          This build is unsigned, so SmartScreen will warn on first run: choose **More info**,
          then **Run anyway**. Signing is pending a code-signing certificate.
          '@

          $notes += "`n`nBuilt from $env:GITHUB_SHA."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          gh release create $tag `
            "installer/bin/Release/ContactQR.msi" `
            --title "ContactQR $version" `
            --notes-file release-notes.md
